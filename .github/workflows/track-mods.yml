name: Build and release mods

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/track-mods.yml'
      - 'mods.py'
      - 'mods.lock.json'

permissions:
  contents: write

concurrency:
  group: publish-mod-bundle

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the latest upstream mods
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 mods.py bundle --output "$RUNNER_TEMP/sts2-release"

      - name: Publish the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/sts2-release"
          tag=$(cat release-tag.txt)
          game_version=$(jq -r .game_version mods.bundle.json)
          bundle="sts2-mods-$game_version.zip"
          assets=("$bundle" "$bundle.sha256" mods.bundle.json)

          if release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,url 2>/dev/null); then
            if [[ $(jq -r .isDraft <<< "$release") == true ]]; then
              gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
              release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url)
            fi
            url=$(jq -r .url <<< "$release")
          else
            url=$(gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --latest --title "STS2 $game_version Mods · ${tag##*-}" \
              --notes-file release-notes.md)
          fi
          printf '[下载打包后的 Mods](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
